# =============================================================================
# RAG Portfolio Application — Configuration
# =============================================================================
# Spring Boot 4.0.3  |  Spring AI 2.0.0-M2  |  Java 25
#
# Architecture:
#   Chat Model   → DeepSeek API (OpenAI-compatible endpoint)
#   Embeddings   → Ollama (mxbai-embed-large, 1024-dim vectors)
#   Vector Store → MariaDB with vector index
#   Frontend     → Single-page chat UI (HTML/CSS/JS served from /templates)
# =============================================================================

spring.application.name=RAG

# =============================================================================
# Chat Model — DeepSeek via OpenAI-compatible API
# =============================================================================
# DeepSeek exposes an OpenAI-compatible endpoint. Spring AI's OpenAI starter
# connects to it by overriding the base URL. The API key below is a placeholder
# — replace with your actual DeepSeek API key before running.
#
# Supported models: deepseek-chat, deepseek-reasoner
# Docs: https://platform.deepseek.com/api-docs

spring.ai.openai.api-key=your-deepseek-api-key-here
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=0.7

# =============================================================================
# Ollama — Local Embedding Model
# =============================================================================
# Ollama runs mxbai-embed-large locally to generate 1024-dimensional embeddings.
# Chat is handled by DeepSeek — OllamaChatAutoConfiguration is excluded to avoid
# a second chat model bean conflicting with the OpenAI/DeepSeek one.
#
# Install Ollama:  https://ollama.com
# Pull the model:  ollama pull mxbai-embed-large

spring.autoconfigure.exclude=org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=mxbai-embed-large

# =============================================================================
# MariaDB — Vector Store
# =============================================================================
# Stores document chunk embeddings with vector similarity search.
# The schema is auto-created on first run (initialize-schema=true).
# Vector dimensions (1024) must match the embedding model (mxbai-embed-large).
#
# Docker quick-start:
#   docker run -d --name mariadb-rag -p 3307:3306 \
#     -e MARIADB_ROOT_PASSWORD=root \
#     -e MARIADB_DATABASE=vdtestingdb \
#     mariadb:11.4

spring.datasource.url=jdbc:mariadb://localhost:3307/vdtestingdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.dimensions=1024
