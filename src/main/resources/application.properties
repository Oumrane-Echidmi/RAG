# =============================================================================
# RAG Portfolio Application — Configuration
# =============================================================================
# Spring Boot 4.0.3  |  Spring AI 2.0.0-M2  |  Java 25
#
# Architecture:
#   Chat Model   → Ollama (llama3.2, local)
#   Embeddings   → Ollama (mxbai-embed-large, 1024-dim vectors)
#   Vector Store → MariaDB with vector index
#   Frontend     → Single-page chat UI (HTML/CSS/JS served from /templates)
# =============================================================================

spring.application.name=RAG

# =============================================================================
# Ollama — Local Chat Model + Embeddings
# =============================================================================
# Everything runs locally through Ollama; no external API key is required.
#
# Install Ollama:  https://ollama.com
# Pull the models:
#   ollama pull llama3.2
#   ollama pull mxbai-embed-large

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.embedding.options.model=mxbai-embed-large

# =============================================================================
# MariaDB — Vector Store
# =============================================================================
# Stores document chunk embeddings with vector similarity search.
# The schema is auto-created on first run (initialize-schema=true).
# Vector dimensions (1024) must match the embedding model (mxbai-embed-large).
#
# Docker quick-start:
#   docker run -d --name mariadb-rag -p 3307:3306 \
#     -e MARIADB_ROOT_PASSWORD=root \
#     -e MARIADB_DATABASE=vdtestingdb \
#     mariadb:11.8

spring.datasource.url=jdbc:mariadb://localhost:3307/vdtestingdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.dimensions=1024
